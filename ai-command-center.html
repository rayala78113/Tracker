<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracker AI</title><style>body{margin:0;background:#0b0f14;color:#eee;font:15px Arial,sans-serif;padding:24px}.box{max-width:900px;margin:auto}h1{margin:0 0 8px}.muted{color:#9aa2ad}.card{background:#151a21;border:1px solid #303844;border-radius:12px;padding:18px;margin-top:18px}textarea{width:100%;box-sizing:border-box;min-height:120px;background:#0f1318;color:#fff;border:1px solid #39414c;border-radius:10px;padding:14px;font:inherit}button{margin:12px 8px 0 0;padding:12px 18px;border:0;border-radius:9px;background:#f4b400;color:#111;font-weight:700;cursor:pointer}button.confirm{background:#4fd276}button.cancel{background:#343b46;color:#fff}.output{white-space:pre-wrap;line-height:1.55}.hidden{display:none}.examples{font-size:13px;color:#808995;margin-top:8px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#242b35;color:#cbd2da;font-size:12px;margin:3px 5px 0 0}</style></head><body><div class="box"><h1>Tracker AI</h1><p class="muted">One place to ask, plan, create, update, assign, add notes, set follow-up, or complete work. Changes require confirmation.</p><div class="card"><textarea id="request" placeholder="Example: Review my open maintenance work and tell me what I should focus on this week."></textarea><div class="examples"><span class="pill">What is Ryan working on?</span><span class="pill">Create a task to inspect the FCT charge pump.</span><span class="pill">Add a note to MOV 71 that the quote is pending.</span><span class="pill">Mark the flare thermoprobe task complete.</span></div><button id="run">Review Request</button><div id="status" class="muted" style="margin-top:10px"></div></div><div id="result" class="card output hidden"></div><div id="actions" class="hidden"><button id="confirm" class="confirm">Confirm & Update Tracker</button><button id="cancel" class="cancel">Cancel</button></div></div><script>const U='https://jbnufforfpgawnawgujv.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6ImpibnVmZm9yZnBnYXduYXdndWp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNzk4ODEsImV4cCI6MjA5MTg1NTg4MX0.Zy4dcmb99FsMUDKMxn2ASsQ2ZmGO0aeCumO21jD8EBY';const H={'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+K};let current=null;const $=id=>document.getElementById(id);$('run').onclick=async()=>{const request=$('request').value.trim();if(!request)return;$('run').disabled=true;$('status').textContent='Working…';$('result').classList.add('hidden');$('actions').classList.add('hidden');current=null;try{const r=await fetch(U+'/functions/v1/tracker-command',{method:'POST',headers:H,body:JSON.stringify({request})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');$('result').classList.remove('hidden');if(d.kind==='answer'){$('result').textContent=d.answer||'No answer returned.';$('status').textContent=d.matched_tasks!=null?`Reviewed ${d.matched_tasks} matching task${d.matched_tasks===1?'':'s'}.`:'';return}current=d.proposal;const p=current;if(p.action_type==='create'){const x=p.create;$('result').textContent=`Proposed new task:\n${x.title}\n\nSection: ${x.section}\nAssigned to: ${x.assigned_to||'Unassigned'}\nFollow-up: ${x.followup?'Yes':'No'}\nPriority: ${x.priority||'Not set'}\nDue date: ${x.due_date||'Not set'}\n\nNotes:\n${x.notes||'None'}\n\nNothing has changed yet.`}else{const changes=Object.entries(p.changes||{}).filter(([,v])=>v!==null).map(([k,v])=>`${k}: ${v}`).join('\n');$('result').textContent=`I found:\n${p.task_title}\n\nProposed change:\n${changes||'No change'}\n\n${p.summary||''}\n\nNothing has changed yet.`}$('actions').classList.remove('hidden');$('status').textContent='Review the proposed change before confirming.'}catch(e){$('result').classList.remove('hidden');$('result').textContent='Error: '+e.message;$('status').textContent=''}finally{$('run').disabled=false}};$('confirm').onclick=async()=>{if(!current)return;$('confirm').disabled=true;$('status').textContent='Updating Tracker…';try{const r=await fetch(U+'/functions/v1/tracker-command',{method:'POST',headers:H,body:JSON.stringify({action:'apply',proposal:current})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Update failed');$('result').textContent=(d.action_type==='create'?'Task created successfully.':'Task updated successfully.')+(d.task?.text?`\n\n${d.task.text}`:'');$('actions').classList.add('hidden');$('status').textContent='Saved to Supabase. Refresh the Tracker to see it.';current=null}catch(e){$('status').textContent='Error: '+e.message}finally{$('confirm').disabled=false}};$('cancel').onclick=()=>{current=null;$('actions').classList.add('hidden');$('result').textContent='Cancelled. Nothing was changed.';$('status').textContent=''};</script></body></html>
