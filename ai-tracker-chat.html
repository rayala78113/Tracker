<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask Tracker AI</title><style>body{margin:0;background:#0b0f14;color:#eee;font:15px Arial,sans-serif;padding:28px}h1{margin:0 0 8px}p{color:#aaa}.box{max-width:850px;margin:auto}textarea{width:100%;box-sizing:border-box;min-height:100px;background:#151a21;color:#fff;border:1px solid #39414c;border-radius:10px;padding:14px;font:inherit}button{margin-top:12px;padding:12px 18px;border:0;border-radius:9px;background:#f4b400;color:#111;font-weight:700;cursor:pointer}#answer{margin-top:22px;white-space:pre-wrap;line-height:1.55;background:#151a21;border:1px solid #303844;border-radius:10px;padding:18px;min-height:80px}.examples{font-size:13px;color:#888}</style></head><body><div class="box"><h1>Ask Tracker AI</h1><p>Ask questions about the work already in your Tracker. This version is read-only and cannot change tasks.</p><textarea id="q" placeholder="Example: What maintenance items are still open at FCT?"></textarea><div class="examples">Try: “What am I waiting on vendors for?” · “What are the oldest open tasks?” · “What is assigned to Ryan?”</div><button id="ask">Ask Tracker</button><div id="answer">Your answer will appear here.</div></div><script>const SUPABASE_URL='https://jbnufforfpgawnawgujv.supabase.co';const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpibnVmZm9yZnBnYXduYXdndWp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNzk4ODEsImV4cCI6MjA5MTg1NTg4MX0.Zy4dcmb99FsMUDKMxn2ASsQ2ZmGO0aeCumO21jD8EBY';const q=document.getElementById('q'),a=document.getElementById('answer'),b=document.getElementById('ask');b.onclick=async()=>{const question=q.value.trim();if(!question)return;a.textContent='Reading Tracker…';b.disabled=true;try{const r=await fetch(SUPABASE_URL+'/functions/v1/ai-tracker-assistant',{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON},body:JSON.stringify({question})});const d=await r.json();a.textContent=r.ok?d.answer:(d.error||('Request failed ('+r.status+')'))}catch(e){a.textContent='Could not reach Tracker AI.'}finally{b.disabled=false}};q.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))b.click()});</script></body></html>
