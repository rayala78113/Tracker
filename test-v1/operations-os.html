<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSAR Operations OS</title><style>:root{--bg:#0a0d11;--panel:#11161c;--line:#27303b;--text:#edf1f5;--muted:#929baa;--amber:#e7a234}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.08em}.sub{font-size:11px;color:var(--muted);margin-top:3px}.tabs{display:flex;gap:7px}.tab,.morebtn{border:1px solid var(--line);background:#171d25;color:var(--muted);border-radius:7px;padding:9px 14px;cursor:pointer}.tab.active{background:var(--amber);border-color:var(--amber);color:#111;font-weight:700}.more{position:relative}.moremenu{display:none;position:absolute;right:0;top:42px;z-index:80;background:#11161d;border:1px solid var(--line);border-radius:9px;padding:7px;min-width:190px;box-shadow:0 12px 30px #0008}.more.open .moremenu{display:grid;gap:5px}.moremenu button{border:0;background:#171d25;color:var(--muted);text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer}.moremenu button:hover{color:var(--text)}.frame{height:calc(100% - 62px)}iframe{width:100%;height:100%;border:0;background:var(--bg)}.note{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#11161cee;border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--muted);font-size:11px;pointer-events:none}@media(max-width:1100px){.top{height:auto;min-height:84px;padding:9px 10px;align-items:flex-start;flex-direction:column;gap:8px}.frame{height:calc(100% - 102px)}.tabs{width:100%;overflow:auto}.tab,.morebtn{white-space:nowrap;min-height:42px}.sub{display:none}.note{display:none}.moremenu{position:fixed;top:92px;right:10px;left:10px;max-height:65vh;overflow:auto}}</style></head><body><header class="top"><div><div class="brand">TSAR OPERATIONS OS</div><div class="sub">Forward execution separated from complete operational history</div></div><div class="tabs"><button class="tab active" data-target="daily-plan.html" data-label="TODAY">TODAY</button><button class="tab" data-target="outreach.html" data-label="OUTREACH">OUTREACH</button><button class="tab" data-target="director-brief.html" data-label="DIRECTOR">DIRECTOR</button><button class="tab" data-target="weekly-review.html" data-label="WEEKLY">WEEKLY</button><button class="tab" data-target="capture.html" data-label="CAPTURE">CAPTURE</button><button class="tab" data-target="projects-control.html" data-label="PROJECTS">PROJECTS</button><button class="tab" data-target="master.html" data-label="MASTER">MASTER</button><div class="more"><button class="morebtn" id="moreBtn">MORE ▾</button><div class="moremenu" id="moreMenu"><button data-target="focus.html" data-label="FOCUS">Focus / intervention</button><button data-target="pressure.html" data-label="PRESSURE">Pressure</button><button data-target="forecast.html" data-label="FORECAST">Forecast</button><button data-target="throughput.html" data-label="THROUGHPUT">Throughput</button><button data-target="inbox.html" data-label="INBOX">Inbox</button><button data-target="morning-brief.html" data-label="BRIEF">Morning brief</button><button data-target="execution-board.html" data-label="EXECUTE">Execution board</button><button data-target="vendor-desk.html" data-label="VENDORS">Vendor desk</button><button data-target="management-priority.html" data-label="PRIORITY">Management priority</button><button data-target="management-report.html" data-label="REPORT">Management report</button><button data-target="activity-log.html" data-label="ACTIVITY">Activity log</button><button data-target="system-health.html" data-label="HEALTH">System health</button><button data-target="resilience.html" data-label="RESILIENCE">Resilience</button></div></div></div></header><div class="frame"><iframe id="workframe" src="daily-plan.html" title="TSAR Operations Today"></iframe></div><div class="note" id="note">TODAY = finite daily management plan</div><script>const frame=document.getElementById('workframe'),more=document.querySelector('.more'),moreBtn=document.getElementById('moreBtn');const notes={'TODAY':'TODAY = finite daily management plan · leverage first · chase 5 · decide 3 · protect 3','DIRECTOR':'DIRECTOR = one-page operating picture · condition · concentration · intervention','OUTREACH':'OUTREACH = consolidated relationship brief · open commitments · objective · copy-ready follow-up','WEEKLY':'WEEKLY = planned high-priority work · waiting projects · closeout · look-ahead','CAPTURE':'CAPTURE = structured intake for projects · actions · decisions · vendor commitments','PROJECTS':'PROJECTS = decisions · blockers · vendors · field complete vs closed','MASTER':'MASTER = authenticated full record · completed history stays intact','FOCUS':'FOCUS = intervention queue · chase · decide · protect · recover','PRESSURE':'PRESSURE = executive workload concentration · dependencies · decisions · aging risk','FORECAST':'FORECAST = leading indicators · likely delay before it becomes overdue','THROUGHPUT':'THROUGHPUT = created vs resolved · whether the backlog is shrinking or growing','INBOX':'INBOX = dump information fast · structure it later · lose nothing','BRIEF':'BRIEF = full morning command view · decisions · hard dates','EXECUTE':'EXECUTE = structured next actions · what actually needs doing','VENDORS':'VENDORS = external commitments · promised dates · follow-up control','PRIORITY':'PRIORITY = ranked management queue · what deserves intervention first','REPORT':'REPORT = live management update · copy-ready by facility or overall','ACTIVITY':'ACTIVITY = who changed what · when · project history','HEALTH':'HEALTH = lifecycle integrity · stale dependencies · true exceptions','RESILIENCE':'RESILIENCE = restore points · integrity checks · recovery readiness'};function openScreen(label,target){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.label===label));frame.src=target;frame.title='TSAR Operations '+label;document.getElementById('note').textContent=notes[label]||'';more.classList.remove('open')}document.querySelectorAll('[data-target]').forEach(btn=>btn.addEventListener('click',()=>openScreen(btn.dataset.label,btn.dataset.target)));moreBtn.onclick=()=>more.classList.toggle('open');document.addEventListener('click',e=>{if(!more.contains(e.target))more.classList.remove('open')});window.addEventListener('message',e=>{if(!e.data||e.data.type!=='opsNavigate')return;let label=String(e.data.label||'').toUpperCase(),btn=[...document.querySelectorAll('[data-target]')].find(x=>x.dataset.label===label);if(!btn)return;let target=btn.dataset.target+(e.data.query?('?'+new URLSearchParams(e.data.query).toString()):'');openScreen(label,target)});frame.addEventListener('load',()=>{try{let w=frame.contentWindow;if(!w)return;let path=w.location.pathname.split('/').pop(),primary=['daily-plan.html','outreach.html','director-brief.html','weekly-review.html','capture.html','projects-control.html','master.html'];if(primary.includes(path)&&!w.document.querySelector('link[data-v1-mobile]')){let l=w.document.createElement('link');l.rel='stylesheet';l.href='mobile-v1.css?v=1';l.dataset.v1Mobile='1';w.document.head.appendChild(l)}if(path==='daily-plan.html'){let s=w.document.createElement('script');s.src='daily-close-guard.js?v=1';w.document.body.appendChild(s)}}catch(e){console.warn('V1 frame enhancement failed',e)}});</script></body></html>
