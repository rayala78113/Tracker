<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSAR Outreach Desk</title><style>:root{--bg:#0b0e12;--p:#11161d;--p2:#171d25;--line:#27303b;--text:#edf1f5;--muted:#8d97a5;--amber:#e8a020;--red:#ef6565;--green:#48c981}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:18px}.title{font-size:20px;font-weight:800}.sub,.m{color:var(--muted);font-size:11px}.type{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;margin-top:10px;font-size:9px;color:var(--amber)}.daily,.priority,.outcomes,.escalations{margin-top:14px}.dailyrow{background:var(--p);border:1px solid var(--line);border-radius:9px;padding:10px;margin:7px 0;display:grid;grid-template-columns:1.1fr .6fr .8fr 2fr;gap:10px;align-items:center}.status{font:700 10px monospace}.due{color:var(--red)}.touched{color:var(--amber)}.done{color:var(--green)}.pri{background:var(--p);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:9px;padding:11px;margin:7px 0;display:grid;grid-template-columns:1.1fr .7fr 2fr;gap:10px}.pri.p1{border-left-color:var(--red)}.out{background:var(--p);border:1px solid var(--line);border-radius:9px;padding:10px;margin:7px 0;display:grid;grid-template-columns:1fr .7fr .7fr 2fr;gap:10px}.working{color:var(--green)}.bad{color:var(--red)}.esc{background:var(--p);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:9px;padding:11px;margin:7px 0;display:grid;grid-template-columns:1.2fr .7fr 2fr;gap:10px;align-items:center}.esc.red{border-left-color:var(--red)}.state,.rank{font:700 10px monospace;color:var(--amber)}.red .state,.p1 .state{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.card{background:var(--p);border:1px solid var(--line);border-radius:9px;padding:13px;scroll-margin-top:14px}.card.target{border-color:var(--amber);box-shadow:0 0 0 2px rgba(232,160,32,.16)}.party{font-size:20px;font-weight:800;margin-top:3px}.objective{font-size:14px;line-height:1.45;margin:12px 0}.draft{white-space:pre-wrap;background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:11px;font:12px/1.5 monospace;max-height:260px;overflow:auto}.btn{border:1px solid var(--line);background:#171d25;color:var(--text);border-radius:7px;padding:8px 11px;margin:8px 5px 0 0;cursor:pointer}.btn.primary{border-color:var(--amber);background:var(--amber);color:#111;font-weight:700}.history{margin-top:8px;padding:8px;border-left:2px solid var(--line);font-size:11px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.dailyrow,.pri,.esc,.out{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="title">DEPENDENCY OUTREACH DESK</div><div class="sub">Know who needs contact today, capture the result, deliberately close the outreach loop, and measure whether escalation reduces pressure.</div><section class="daily"><div class="type">TODAY'S OUTREACH CONTROL</div><div id="daily"></div></section><section class="priority"><div class="type">CONTACT PRIORITY</div><div id="priority"></div></section><section class="outcomes"><div class="type">ESCALATION EFFECTIVENESS</div><div id="outcomes"></div></section><section class="escalations"><div class="type">ESCALATION QUEUE</div><div id="escalations"></div></section><div class="grid" id="grid">Loading…</div></div><script src="auth.js"></script><script>const $=x=>document.getElementById(x),safe=v=>(v??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const targetParty=new URLSearchParams(location.search).get('party');let briefs=[],history=[];window.copyBrief=async i=>{let b=briefs[i];try{await navigator.clipboard.writeText(b.draft_followup);alert('Follow-up copied.')}catch(e){prompt('Copy follow-up:',b.draft_followup)}};window.recordTouch=async i=>{let b=briefs[i],channel=prompt('Touchpoint type?','Call');if(channel===null)return;let summary=prompt('What did they commit to / what changed?','');if(summary===null)return;let blocker=prompt('Actual blocker, if any:','');if(blocker===null)return;let commitment=prompt('Firm commitment date if one was given (YYYY-MM-DD):','');if(commitment===null)return;let next=prompt('Next follow-up date (YYYY-MM-DD):',commitment||'');if(next===null)return;try{let r=await OPS_AUTH.rpc('ops_record_dependency_touchpoint',{p_party:b.dependency_party,p_channel:channel||null,p_summary:summary||null,p_blocker:blocker||null,p_commitment_date:commitment||null,p_next_followup_date:next||null,p_actor:'Operations OS Outreach'});alert(`Touchpoint recorded.\n${r.vendor_commitments_updated} vendor commitments updated.\n${r.actions_updated} waiting actions updated.`);await load()}catch(e){alert(e.message)}};window.closeOutreach=async party=>{let outcome=prompt('Outcome status?','CONTACTED');if(outcome===null)return;try{await OPS_AUTH.rpc('ops_mark_dependency_outreach_complete',{p_party:party,p_outcome_status:outcome||'CONTACTED',p_actor:'Operations OS Outreach'});await load()}catch(e){alert(e.message)}};async function load(){let u=await OPS_AUTH.requireUser('outreach.html');if(!u)return;let esc,out,pri,daily;[briefs,history,esc,out,pri,daily]=await Promise.all([OPS_AUTH.rest('ops_dependency_outreach_briefs?select=*&order=max_attention_score.desc,open_items.desc'),OPS_AUTH.rest('ops_dependency_touchpoint_history?select=*&party_recency_rank=eq.1&order=touchpoint_at.desc'),OPS_AUTH.rest('ops_dependency_escalation_queue?select=*&order=escalation_rank.asc,dependency_pressure_score.desc'),OPS_AUTH.rest('ops_dependency_escalation_effectiveness?select=*&order=escalated_at.desc&limit=10'),OPS_AUTH.rest('ops_dependency_contact_priority?select=*&contact_priority=lte.2&order=contact_priority.asc,dependency_pressure_score.desc&limit=10'),OPS_AUTH.rest('ops_dependency_daily_outreach_status?select=*&order=completed_today.asc,contact_priority.asc,dependency_pressure_score.desc')]);$('daily').innerHTML=daily.map(x=>`<div class="dailyrow"><div><div class="party">${safe(x.dependency_party)}</div><div class="m">${safe(x.contact_action)} · pressure ${x.dependency_pressure_score}</div></div><div class="status ${String(x.today_status).toLowerCase()}">${safe(x.today_status)}</div><div class="m">${x.touchpoints_today} touch${x.touchpoints_today===1?'':'es'} today</div><div>${safe(x.contact_guidance)}${x.today_status==='TOUCHED'?`<div><button class="btn primary" onclick='closeOutreach(${JSON.stringify(x.dependency_party)})'>Close Outreach</button></div>`:''}${x.today_status==='DUE'?`<div class="m">Record the touchpoint before this can be closed.</div>`:''}</div></div>`).join('')||'<div class="m" style="margin-top:8px">No priority outreach obligations today.</div>';$('priority').innerHTML=pri.map(x=>`<div class="pri ${x.contact_priority===1?'p1':''}"><div><div class="state">${safe(x.contact_action)}</div><div class="party">${safe(x.dependency_party)}</div></div><div class="m">Pressure ${x.dependency_pressure_score} · ${x.open_items} open · ${x.touchpoints} structured touches</div><div>${safe(x.contact_guidance)}${x.next_followup_date?`<div class="m">Next follow-up ${safe(x.next_followup_date)}</div>`:''}</div></div>`).join('')||'<div class="m" style="margin-top:8px">No priority relationship contacts due.</div>';$('outcomes').innerHTML=out.map(x=>`<div class="out"><div><div class="party">${safe(x.dependency_party)}</div><div class="m">${new Date(x.escalated_at).toLocaleDateString()}</div></div><div><div class="state ${['WORKING','IMPROVING'].includes(x.escalation_outcome)?'working':['WORSENING','NO CHANGE'].includes(x.escalation_outcome)?'bad':''}">${safe(x.escalation_outcome)}</div><div class="m">Outcome</div></div><div><div>${x.pressure_at_escalation} → ${x.current_pressure}</div><div class="m">Pressure · ${x.pressure_change>0?'-':''}${Math.abs(x.pressure_change)} change</div></div><div>${safe(x.outcome_guidance)}${x.commitment_date?`<div class="m">Commitment ${safe(x.commitment_date)}</div>`:''}</div></div>`).join('')||'<div class="m" style="margin-top:8px">No escalation outcomes recorded yet.</div>';$('escalations').innerHTML=esc.map(x=>`<div class="esc ${x.response_quality==='ESCALATE'?'red':''}"><div><div class="state">${safe(x.escalation_action).toUpperCase()}</div><div class="party">${safe(x.dependency_party)}</div></div><div class="m">Pressure ${x.dependency_pressure_score} · ${x.open_items} open · ${x.commitment_capture_pct??0}% dated</div><div><div>${safe(x.response_guidance)}</div><div class="m">${x.next_followup_date?'Next follow-up '+safe(x.next_followup_date):'No next follow-up date set'}</div></div></div>`).join('')||'<div class="m" style="margin-top:8px">No relationships currently require escalation.</div>';$('grid').innerHTML=briefs.map((b,i)=>{let h=history.find(x=>x.dependency_party.toLowerCase()===b.dependency_party.toLowerCase()),isTarget=targetParty&&b.dependency_party.toLowerCase()===targetParty.toLowerCase();return `<section class="card ${isTarget?'target':''}" id="brief-${i}"><div class="rank">${safe(b.outreach_type).toUpperCase()}</div><div class="party">${safe(b.dependency_party)}</div><div class="m">${b.open_items} open · ${b.high_priority_items} high priority · ${b.affected_projects} projects · ${safe(b.facilities||'')}</div><div class="type">OBJECTIVE</div><div class="objective">${safe(b.meeting_objective)}</div><div class="type">OPEN COMMITMENTS</div><div class="draft">${safe(b.open_commitments||'No open commitments.')}</div><div class="type">DRAFT FOLLOW-UP</div><div class="draft">${safe(b.draft_followup)}</div>${h?`<div class="history">Last touchpoint: ${new Date(h.touchpoint_at).toLocaleString()} · ${safe(h.channel||'')}${h.summary?' · '+safe(h.summary):''}${h.next_followup_date?' · next '+safe(h.next_followup_date):''}</div>`:''}<button class="btn" onclick="copyBrief(${i})">Copy Follow-Up</button><button class="btn primary" onclick="recordTouch(${i})">Record Touchpoint</button></section>`}).join('')||'<div class="m">No external dependency outreach is currently required.</div>';if(targetParty){let i=briefs.findIndex(b=>b.dependency_party.toLowerCase()===targetParty.toLowerCase());if(i>=0)setTimeout(()=>document.getElementById('brief-'+i)?.scrollIntoView({behavior:'smooth',block:'start'}),80)}}load().catch(e=>$('grid').textContent=e.message);</script></body></html>
