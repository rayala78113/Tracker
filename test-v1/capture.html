<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSAR Capture</title><style>:root{--bg:#0b0e12;--p:#11161d;--p2:#171d25;--line:#27303b;--text:#edf1f5;--muted:#8d97a5;--amber:#e8a020;--green:#48c981;--red:#ef6565;--blue:#5aa7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.title{font-size:20px;font-weight:800}.sub{color:var(--muted);font-size:11px;margin-top:3px}.quick,.card{background:var(--p);border:1px solid var(--line);border-radius:9px;padding:14px;margin-top:14px}.quick textarea{min-height:110px}.hint{font-size:11px;color:var(--muted);margin-top:6px}.tabs{display:flex;gap:7px;margin:14px 0;flex-wrap:wrap}.tab,button{border:1px solid var(--line);background:var(--p2);color:var(--text);border-radius:7px;padding:9px 12px;cursor:pointer}.tab.active{border-color:var(--amber);color:var(--amber)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;margin-bottom:4px}input,select,textarea{width:100%;background:var(--p2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:9px}textarea{min-height:90px;resize:vertical}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:12px}.status{margin-top:10px;color:var(--muted)}.ok{color:var(--green)}.err{color:var(--red)}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div class="wrap"><div class="title">CAPTURE</div><div class="sub">Fast structured intake for new operational work</div><section class="quick"><label>Rapid field note</label><textarea id="quick" placeholder="Example: Elmendorf truck rack header leak above lane 3. High priority. Pinnacle inspecting. Waiting on vac truck. Need repair, pressure test and closeout photos."></textarea><div class="actions"><button id="parse">Structure Note</button></div><div class="hint">The parser only pre-fills fields. Review the structured record before saving.</div></section><div class="tabs"><button class="tab active" data-mode="project">New Project</button><button class="tab" data-mode="action">New Action</button><button class="tab" data-mode="decision">New Decision</button><button class="tab" data-mode="vendor">Vendor Commitment</button></div><section class="card"><div class="grid" id="form"></div><div class="actions"><button id="save">Review & Save</button><button id="clear">Clear</button></div><div id="status" class="status"></div></section></div><script src="auth.js"></script><script>const $=x=>document.getElementById(x),safe=v=>(v??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let mode='project',P=[],inboxId=null;async function post(table,body){let r=await OPS_AUTH.rest(table,{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});return Array.isArray(r)?r[0]:r}async function patch(table,id,body){return OPS_AUTH.rest(table+'?id=eq.'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}async function logEvent(type,id,pid,event,summary,metadata={}){await post('ops_activity_log',{entity_type:type,entity_id:id,project_id:pid,event_type:event,summary,actor:'Operations OS Capture',metadata})}function projectOptions(){return '<option value="">Select project</option>'+P.map(p=>`<option value="${p.id}">${safe(p.title)} · ${safe(p.facility||'')}</option>`).join('')}function render(){let h='';if(mode==='project')h=`<div class="wide"><label>Project title</label><input id="title"></div><div><label>Facility</label><select id="facility"><option>Falls City</option><option>Elmendorf</option><option>KNPS</option><option>TSAR Pipeline</option><option>TSAR</option><option>Multiple</option></select></div><div><label>Priority</label><select id="priority"><option>medium</option><option>high</option><option>low</option></select></div><div><label>Status</label><select id="pstatus"><option value="identified">Identified</option><option value="in_progress">In Progress</option><option value="waiting">Waiting</option><option value="authorized">Authorized</option></select></div><div><label>Due date (only if real)</label><input id="due" type="date"></div><div><label>Vendor</label><input id="vendor"></div><div><label>Owner</label><input id="owner" placeholder="Leave blank if yours"></div><div class="wide"><label>Description</label><textarea id="desc"></textarea></div><div class="wide"><label>Closeout requirements</label><textarea id="closeout"></textarea></div>`;if(mode==='action')h=`<div class="wide"><label>Parent project</label><select id="project">${projectOptions()}</select></div><div class="wide"><label>Action</label><input id="title"></div><div><label>Priority</label><select id="priority"><option>medium</option><option>high</option><option>low</option></select></div><div><label>Owner</label><input id="owner" placeholder="Ryan, Jacob, or blank"></div><div><label>Due date (only if real)</label><input id="due" type="date"></div><div><label>Waiting on</label><input id="waiting"></div><div><label>Active follow-up?</label><select id="follow"><option value="false">No</option><option value="true">Yes</option></select></div><div class="wide"><label>Description</label><textarea id="desc"></textarea></div>`;if(mode==='decision')h=`<div class="wide"><label>Parent project</label><select id="project">${projectOptions()}</select></div><div class="wide"><label>Decision required</label><input id="title"></div><div><label>Decision owner</label><input id="owner"></div><div><label>Due date</label><input id="due" type="date"></div><div class="wide"><label>Context</label><textarea id="context"></textarea></div><div class="wide"><label>Options</label><textarea id="options"></textarea></div><div class="wide"><label>Recommendation</label><textarea id="rec"></textarea></div>`;if(mode==='vendor')h=`<div class="wide"><label>Parent project</label><select id="project">${projectOptions()}</select></div><div><label>Vendor</label><input id="vendor"></div><div><label>Contact</label><input id="contact"></div><div class="wide"><label>Commitment</label><textarea id="commitment"></textarea></div><div><label>Due date</label><input id="due" type="date"></div><div><label>Next follow-up</label><input id="next" type="date"></div>`;$('form').innerHTML=h;$('status').textContent=''}function val(id){return document.getElementById(id)?.value?.trim()||''}function num(id){let v=val(id);return v?Number(v):null}function set(id,v){let e=document.getElementById(id);if(e&&v)e.value=v}function parseQuick(){let t=$('quick').value.trim();if(!t)return;mode='project';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode==='project'));render();let l=t.toLowerCase(),facility=l.includes('elmendorf')?'Elmendorf':l.includes('falls city')||l.includes('fct')?'Falls City':l.includes('knps')?'KNPS':l.includes('tsar pipeline')?'TSAR Pipeline':l.includes('tsar')?'TSAR':'Multiple',priority=/critical|urgent|high priority|shutdown|leak|failure/.test(l)?'high':'medium',vendor='';['Pinnacle','USA DeBusk','RST','MIS','Everline','Opsite','Flowzone','Angus Measurement','PipelineWise'].some(v=>{if(l.includes(v.toLowerCase())){vendor=v;return true}});let first=t.split(/[.!?\n]/).map(x=>x.trim()).find(Boolean)||t;set('title',first.slice(0,120));set('facility',facility);set('priority',priority);set('vendor',vendor);set('desc',t);let close=[];if(/repair|replace|r&r/.test(l))close.push('Repair/replacement completed and verified');if(/pressure test|test/.test(l))close.push('Testing documented');if(/photo/.test(l))close.push('Closeout photos retained');if(/moc/.test(l))close.push('MOC closeout completed');if(/drawing|redline|as-built/.test(l))close.push('Drawings/redlines updated');set('closeout',close.join('; '));if(/waiting on|awaiting/.test(l))set('pstatus','waiting');else if(/responded|inspecting|in progress|repairing|working/.test(l))set('pstatus','in_progress');$('status').className='status ok';$('status').textContent=inboxId?'Inbox note structured. Review and save to clear it from Inbox.':'Field note structured. Review the fields below before saving.'}async function save(){try{let body,table,type,event,summary,pid=null;if(mode==='project'){if(!val('title'))throw Error('Project title is required.');body={title:val('title'),description:val('desc')||null,facility:val('facility')||null,owner:val('owner')||null,vendor:val('vendor')||null,priority:val('priority')||'medium',status:val('pstatus')||'identified',due_date:val('due')||null,closeout_requirements:val('closeout')||null};table='ops_projects';type='project';event='project_created';summary='Project captured: '+body.title}else if(mode==='action'){pid=num('project');if(!pid||!val('title'))throw Error('Parent project and action title are required.');body={project_id:pid,title:val('title'),description:val('desc')||null,owner:val('owner')||null,priority:val('priority')||'medium',due_date:val('due')||null,waiting_on:val('waiting')||null,followup:val('follow')==='true'};table='ops_actions';type='action';event='action_created';summary='Action captured: '+body.title}else if(mode==='decision'){pid=num('project');if(!pid||!val('title'))throw Error('Parent project and decision title are required.');body={project_id:pid,title:val('title'),decision_owner:val('owner')||null,due_date:val('due')||null,context:val('context')||null,options:val('options')||null,recommendation:val('rec')||null};table='ops_decisions';type='decision';event='decision_created';summary='Decision captured: '+body.title}else{pid=num('project');if(!pid||!val('vendor')||!val('commitment'))throw Error('Project, vendor, and commitment are required.');body={project_id:pid,vendor:val('vendor'),contact:val('contact')||null,commitment:val('commitment'),due_date:val('due')||null,next_followup_date:val('next')||null,status:'open'};table='ops_vendor_commitments';type='vendor_commitment';event='vendor_commitment_created';summary='Vendor commitment captured: '+body.vendor+' — '+body.commitment}let preview=Object.entries(body).filter(([k,v])=>v!==null&&v!=='').map(([k,v])=>k+': '+v).join('\n');if(!confirm('Save this '+mode+'?\n\n'+preview))return;let r=await post(table,body);pid=pid||r.id;await logEvent(type,r.id,pid,event,summary,{source:inboxId?'inbox':'capture',inbox_id:inboxId});let hadInbox=!!inboxId;if(inboxId){await patch('ops_inbox',inboxId,{processed_at:new Date().toISOString(),processed_as:mode,processed_entity_id:r.id});sessionStorage.removeItem('ops_capture_note');sessionStorage.removeItem('ops_inbox_id');inboxId=null}$('status').className='status ok';$('status').textContent='Saved, logged'+(hadInbox?' and Inbox cleared':'')+'.';if(mode==='project'){P.push(r);P.sort((a,b)=>a.title.localeCompare(b.title))}setTimeout(render,900)}catch(e){$('status').className='status err';$('status').textContent=e.message}}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()});$('parse').onclick=parseQuick;$('save').onclick=save;$('clear').onclick=render;(async()=>{let u=await OPS_AUTH.requireUser('capture.html');if(!u)return;P=await OPS_AUTH.rest('ops_projects?select=id,title,facility&status=neq.closed&order=title.asc');render();let note=sessionStorage.getItem('ops_capture_note'),iid=sessionStorage.getItem('ops_inbox_id');if(note&&iid){inboxId=Number(iid);$('quick').value=note;parseQuick()}})().catch(e=>$('status').textContent=e.message);</script></body></html>
