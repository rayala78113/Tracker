<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSAR Master Record</title><style>:root{--bg:#0b0e12;--p:#11161d;--p2:#171d25;--line:#27303b;--text:#edf1f5;--muted:#8d97a5;--amber:#e8a020;--green:#48c981}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:18px}.title{font-size:20px;font-weight:800}.sub,.m{color:var(--muted);font-size:11px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.kpi,.card{background:var(--p);border:1px solid var(--line);border-radius:9px;padding:13px}.kpi b{display:block;font:700 24px monospace}.kpi span{font-size:9px;color:var(--muted);text-transform:uppercase}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input,.bar select{background:var(--p2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:9px}.bar input{flex:1;min-width:220px}.item{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:10px;margin:7px 0}.t{font-weight:700}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;margin:6px 4px 0 0;font-size:9px}.green{color:var(--green)}.amber{color:var(--amber)}@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="title">MASTER RECORD</div><div class="sub">Authenticated full task history. This is the record surface, not the daily execution queue.</div><div class="kpis"><div class="kpi"><b id="total">—</b><span>Total</span></div><div class="kpi"><b id="open">—</b><span>Open</span></div><div class="kpi"><b id="done">—</b><span>Completed</span></div><div class="kpi"><b id="follow">—</b><span>Follow-Up Open</span></div></div><div class="bar"><input id="search" placeholder="Search task, notes, section, assignee"><select id="state"><option value="all">All records</option><option value="open">Open only</option><option value="done">Completed only</option></select></div><section class="card"><div id="rows">Loading…</div></section></div><script src="auth.js"></script><script>const $=x=>document.getElementById(x),safe=v=>(v??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let T=[];function render(){let q=$('search').value.trim().toLowerCase(),s=$('state').value,a=T.filter(x=>{let done=!!x.completed;if(s==='open'&&done)return false;if(s==='done'&&!done)return false;if(q&&!`${x.text||x.title||''} ${x.notes||''} ${x.section||''} ${x.assigned_to||''}`.toLowerCase().includes(q))return false;return true});$('rows').innerHTML=a.map(x=>`<div class="item"><div class="t">${safe(x.text||x.title||'(untitled)')}</div><div class="m">${safe(x.section||'')} ${x.assigned_to?'· '+safe(x.assigned_to):''} ${x.date_added?'· '+new Date(x.date_added).toLocaleDateString():''}</div><span class="pill ${x.completed?'green':'amber'}">${x.completed?'COMPLETED':'OPEN'}</span>${x.followup&&!x.completed?'<span class="pill amber">FOLLOW-UP</span>':''}${x.completed_by?`<span class="pill">BY ${safe(x.completed_by)}</span>`:''}${x.completion_notes?`<div class="m" style="margin-top:7px">Closeout: ${safe(x.completion_notes)}</div>`:''}${x.notes?`<div class="m" style="margin-top:7px">${safe(x.notes)}</div>`:''}</div>`).join('')||'<div class="m">No matching records.</div>'}async function load(){let u=await OPS_AUTH.requireUser('master.html');if(!u)return;T=await OPS_AUTH.rest('tasks?select=*&order=created_at.desc');$('total').textContent=T.length;$('open').textContent=T.filter(x=>!x.completed).length;$('done').textContent=T.filter(x=>x.completed).length;$('follow').textContent=T.filter(x=>!x.completed&&x.followup).length;render()}$('search').addEventListener('input',render);$('state').addEventListener('change',render);load().catch(e=>$('rows').textContent=e.message);</script></body></html>
