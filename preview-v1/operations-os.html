<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSAR Operations OS V1 Preview</title><style>:root{--bg:#0a0d11;--panel:#11161c;--line:#27303b;--text:#edf1f5;--muted:#929baa;--amber:#e7a234}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.top{min-height:70px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.08em}.preview{font:700 10px monospace;color:var(--amber);margin-top:4px}.tabs{display:flex;gap:7px}.tab{border:1px solid var(--line);background:#171d25;color:var(--muted);border-radius:7px;padding:10px 13px;cursor:pointer;white-space:nowrap}.tab.active{background:var(--amber);border-color:var(--amber);color:#111;font-weight:700}.frame{height:calc(100% - 70px)}iframe{width:100%;height:100%;border:0;background:var(--bg)}@media(max-width:900px){.top{display:block;padding:10px}.tabs{margin-top:9px;width:100%;overflow:auto}.frame{height:calc(100% - 116px)}.tab{min-height:44px}}</style></head><body><header class="top"><div><div class="brand">TSAR OPERATIONS OS</div><div class="preview">V1 RELEASE CANDIDATE PREVIEW · PRODUCTION ROOT UNCHANGED</div></div><div class="tabs"><button class="tab active" data-target="daily-plan.html" data-label="TODAY">TODAY</button><button class="tab" data-target="outreach.html" data-label="OUTREACH">OUTREACH</button><button class="tab" data-target="director-brief.html" data-label="DIRECTOR">DIRECTOR</button><button class="tab" data-target="weekly-review.html" data-label="WEEKLY">WEEKLY</button><button class="tab" data-target="capture.html" data-label="CAPTURE">CAPTURE</button><button class="tab" data-target="projects-control.html" data-label="PROJECTS">PROJECTS</button><button class="tab" data-target="master.html" data-label="MASTER">MASTER</button></div></header><div class="frame"><iframe id="workframe" src="daily-plan.html" title="TSAR Operations Today"></iframe></div><script>const frame=document.getElementById('workframe');function openScreen(label,target){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.label===label));frame.src=target;frame.title='TSAR Operations '+label}document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>openScreen(btn.dataset.label,btn.dataset.target)));window.addEventListener('message',e=>{if(!e.data||e.data.type!=='opsNavigate')return;let label=String(e.data.label||'').toUpperCase(),btn=[...document.querySelectorAll('.tab')].find(x=>x.dataset.label===label);if(!btn)return;let target=btn.dataset.target+(e.data.query?('?'+new URLSearchParams(e.data.query).toString()):'');openScreen(label,target)});frame.addEventListener('load',()=>{try{let w=frame.contentWindow;if(!w)return;let path=w.location.pathname.split('/').pop(),primary=['daily-plan.html','outreach.html','director-brief.html','weekly-review.html','capture.html','projects-control.html','master.html'];if(primary.includes(path)&&!w.document.querySelector('link[data-v1-mobile]')){let l=w.document.createElement('link');l.rel='stylesheet';l.href='mobile-v1.css?v=1';l.dataset.v1Mobile='1';w.document.head.appendChild(l)}if(path==='daily-plan.html'){let s=w.document.createElement('script');s.src='daily-close-guard.js?v=1';w.document.body.appendChild(s)}}catch(e){console.warn('Preview enhancement failed',e)}});</script></body></html>
