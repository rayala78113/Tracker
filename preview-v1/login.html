<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSAR Login</title><style>:root{--bg:#0b0e12;--p:#11161d;--line:#27303b;--text:#edf1f5;--muted:#8d97a5;--green:#48c981;--red:#ef6565}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.card{width:min(420px,92vw);background:var(--p);border:1px solid var(--line);border-radius:12px;padding:20px}.title{font-size:20px;font-weight:800}.sub{color:var(--muted);font-size:11px;margin:5px 0 16px}input,button{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:#171d25;color:var(--text);margin-top:8px}button{cursor:pointer}.status{margin-top:12px;font-size:12px}.ok{color:var(--green)}.err{color:var(--red)}</style></head><body><div class="card"><div class="title">TSAR OPERATIONS OS</div><div class="sub">Administrator sign-in. Access is restricted at the database layer.</div><input id="email" type="email" value="rayala78113@gmail.com" autocomplete="email"><button id="send">Send Sign-In Link</button><div id="status" class="status"></div></div><script src="auth.js"></script><script>const $=x=>document.getElementById(x),ADMIN='rayala78113@gmail.com';async function boot(){if(OPS_AUTH.captureHash()){let u=await OPS_AUTH.user();if(u&&String(u.email).toLowerCase()===ADMIN){location.href=sessionStorage.getItem('ops_return_to')||'operations-os.html';return}if(u){await OPS_AUTH.signOut();return}}let u=await OPS_AUTH.user();if(u&&String(u.email).toLowerCase()===ADMIN){$('status').className='status ok';$('status').textContent='Signed in as '+u.email+'.';setTimeout(()=>location.href=sessionStorage.getItem('ops_return_to')||'operations-os.html',400)}}$('send').onclick=async()=>{let email=$('email').value.trim().toLowerCase();if(email!==ADMIN){$('status').className='status err';$('status').textContent='This account is not authorized for Operations OS.';return}try{await OPS_AUTH.magic(email,location.href);$('status').className='status ok';$('status').textContent='Sign-in link sent. Open the email on this device.'}catch(e){$('status').className='status err';$('status').textContent=e.message}};boot();</script></body></html>
